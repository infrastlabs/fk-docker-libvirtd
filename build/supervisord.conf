[supervisord]
nodaemon=true
user=root
# [supervisord]
# logfile=/var/log/supervisor/supervisord.log ; (main log file;default $CWD/supervisord.log)
# pidfile=/var/run/supervisord.pid ; (supervisord pidfile;default supervisord.pid)
# childlogdir=/var/log/supervisor            ; ('AUTO' child log dir, default $TEMP)

[unix_http_server]
file=/var/run/supervisor.sock   ; (the path to the socket file)
chmod=0700                       ; sockef file mode (default 0700)
[supervisorctl]
serverurl=unix:///var/run/supervisor.sock ; use a unix:// URL  for a unix socket
# Sorry, supervisord responded but did not recognize the supervisor namespace commands that supervisorctl uses to control it.  Please check that the [rpcinterface:supervisor] section is enabled in the configuration file (see sample.conf).
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# go-sv
# [inet_http_server]
# port=0.0.0.0:9001
# username=admin
# password=admin123
# ;prom http://127.0.0.1:9001/metrics

[program:libvirtd]
command=/usr/sbin/libvirtd

[program:virtlockd]
command=/usr/sbin/virtlockd

[program:virtlogd]
command=/usr/sbin/virtlogd

[program:dropbear]
priority=40
user=root
# environment=DISPLAY=:$N
command=/bin/bash -c "exec dropbear -E -F -R -p $SSHD_PORT"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/dropbear.log
stdout_logfile_maxbytes=20MB ;0
stdout_logfile_backups=0     ; # of stdout logfile backups (0 means none, default 10)
redirect_stderr=true
