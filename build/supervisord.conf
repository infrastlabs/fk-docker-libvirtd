# environment=VIR_BRIDGE_NAME=virbr0
# command=/bin/bash -c "exec /usr/sbin/dnsmasq --no-daemon --conf-file=/var/lib/libvirt/dnsmasq/virter.conf --leasefile-ro --dhcp-script=/usr/lib/libvirt/libvirt_leaseshelper"

[program:dropbear]
priority=40
user=root
# environment=DISPLAY=:$N
command=/bin/bash -c "bash /srv/local/libvirt/build/virtinit.sh; exec dropbear -E -F -R -p $SSHD_PORT"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/dropbear.log
stdout_logfile_maxbytes=20MB ;0
stdout_logfile_backups=0     ; # of stdout logfile backups (0 means none, default 10)
redirect_stderr=true
